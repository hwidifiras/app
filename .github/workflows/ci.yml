name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymday
          POSTGRES_PASSWORD: gymday
          POSTGRES_DB: gymday_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymday -d gymday_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: true
      DATABASE_URL: postgresql://gymday:gymday@127.0.0.1:5432/gymday_test?schema=public
      TEST_DATABASE_URL: postgresql://gymday:gymday@127.0.0.1:5432/gymday_test?schema=public
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_URL: https://app.example.test
      APP_TIMEZONE: UTC
      SAAS_ROOT_DOMAIN: example.test
      DEFAULT_TENANT_SLUG: test
      ALLOW_PUBLIC_REGISTER: "false"
      RESEND_API_KEY: ""
      PASSWORD_RESET_FROM: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --no-cache

      - name: Test against disposable PostgreSQL
        run: npm test

      - name: Build production application
        run: npm run build
