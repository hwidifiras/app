name: Offline Windows
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: node --test tests/offline-runtime.node.mjs
      - run: pnpm --dir desktop --ignore-workspace install --frozen-lockfile --ignore-scripts --config.node-linker=hoisted
      - run: node desktop/node_modules/electron/install.js
      - run: pnpm desktop:package
      - run: pnpm test:server
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Playwright-results
          path: |
            artifacts/playwright/report
            artifacts/playwright/results.json
            artifacts/playwright/test-results
          if-no-files-found: ignore
      - run: node scripts/offline-desktop-smoke.mjs
      - run: pnpm --dir desktop --ignore-workspace exec electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: All-in-Gym-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            artifacts/desktop-smoke/result.json
            artifacts/desktop-smoke/enrollment.png
            artifacts/server-smoke/result.json
          if-no-files-found: error
